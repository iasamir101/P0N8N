# n8n derrière le reverse proxy commun de la VM (dépôt P0PILOTEVM, alias réseau « n8n-app »).
# Aucun port publié : seul le Caddy de ~/p0pilotevm/proxy écoute sur 80/443.
# Prérequis : réseau « web » existant (docker network create web) et fichier .env (copie de .env.example).
name: n8n

services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest   # fixer une version précise une fois validée
    restart: unless-stopped
    environment:
      - N8N_HOST=${N8N_DOMAIN}
      - N8N_PROTOCOL=https
      - WEBHOOK_URL=https://${N8N_DOMAIN}/
      - GENERIC_TIMEZONE=${TZ}
      - TZ=${TZ}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - EXECUTIONS_DATA_PRUNE=true
      - EXECUTIONS_DATA_MAX_AGE=168
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      web:
        aliases:
          - n8n-app

networks:
  web:
    external: true

volumes:
  n8n_data:
